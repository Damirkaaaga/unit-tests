name: Lint and Test

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Fix husky permission
        run: |
          chmod +x .husky/pre-commit
          chmod +x .husky/_/husky.sh || true

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint .

      - name: Run Unit Tests
        run: npm test
